<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiAi - 预测竞赛</title>
<link rel="icon" type="image/svg+xml" href="figs/stock.svg">
<link rel="stylesheet" href="assets/css/styles.css?v=4.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--pc-border:#30363d;--pc-panel:#161b22;--pc-panel-2:#0d1117;--pc-text:#e6edf3;--pc-muted:#8b949e;--pc-accent:#58a6ff;--pc-up:#f85149;--pc-down:#3fb950}
.pc-header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.pc-header h2{margin:0;color:var(--pc-text)}.pc-header p{margin:4px 0 0;color:var(--pc-muted);font-size:13px}.pc-actions{display:flex;align-items:center;gap:10px}.pc-refresh,.pc-download{height:34px;border:1px solid #2f81f7;border-radius:6px;background:transparent;color:var(--pc-accent);padding:0 12px;font:inherit;cursor:pointer}.pc-refresh:hover{background:rgba(56,139,253,.12)}.pc-download{border-color:#18a6b8;background:rgba(24,166,184,.12);color:#3dd6e8}.pc-download:hover{background:rgba(24,166,184,.22)}
.pc-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.pc-stat{background:var(--pc-panel);border:1px solid var(--pc-border);border-radius:6px;padding:13px 15px}.pc-stat label{display:block;color:var(--pc-muted);font-size:12px;margin-bottom:5px}.pc-stat strong{font-size:22px;color:var(--pc-text)}
.pc-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}.pc-table-wrap,.pc-detail{border:1px solid var(--pc-border);background:var(--pc-panel-2);border-radius:6px;overflow:hidden}.pc-table{width:100%;border-collapse:collapse}.pc-table th,.pc-table td{padding:12px;text-align:left;border-bottom:1px solid var(--pc-border);font-size:12px}.pc-table th{color:var(--pc-muted);background:var(--pc-panel);font-weight:500}.pc-table tbody tr{cursor:pointer}.pc-table tbody tr:hover,.pc-table tbody tr.active{background:#172235}.pc-table tbody tr:last-child td{border-bottom:none}.pc-table .score{font-weight:600;color:#e6edf3}.pc-rank{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:50%;background:#30363d;color:#c9d1d9;font-weight:700}.rank-1{background:#b88a2d;color:#fff}.rank-2{background:#718096;color:#fff}.rank-3{background:#8e5b3a;color:#fff}.pc-done{color:var(--pc-down)}.pc-pending{color:#d29922}.pc-up{color:var(--pc-up)}.pc-down{color:var(--pc-down)}
.pc-detail-head{padding:14px;border-bottom:1px solid var(--pc-border)}.pc-detail-head h3{margin:0;font-size:14px;color:var(--pc-text)}.pc-detail-head p{margin:4px 0 0;font-size:11px;color:var(--pc-muted)}.pc-detail-body{padding:14px}.pc-detail-metrics{display:flex;gap:8px;margin-bottom:12px}.pc-detail-metrics span{flex:1;border:1px solid var(--pc-border);border-radius:5px;padding:9px;color:var(--pc-muted);font-size:11px}.pc-detail-metrics b{display:block;margin-top:4px;color:var(--pc-text);font-size:16px}.pc-prediction-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--pc-border);background:transparent;color:#c9d1d9;text-align:left;font:inherit;font-size:11px;cursor:pointer}.pc-prediction-item:hover,.pc-prediction-item.active{background:#172235}.pc-prediction-item small{display:block;color:var(--pc-muted);margin-top:2px}.pc-detail-focus{margin-top:15px;border-top:1px solid var(--pc-border);padding-top:14px}.pc-detail-focus h4{margin:0;color:var(--pc-text);font-size:14px}.pc-detail-focus>p{margin:4px 0 13px;color:var(--pc-muted);font-size:11px}.pc-detail-item{margin:12px 0}.pc-detail-item label{display:block;color:var(--pc-muted);font-size:11px;margin-bottom:4px}.pc-detail-item p{margin:0;color:#c9d1d9;font-size:12px;line-height:1.7;white-space:pre-wrap}.pc-empty{min-height:330px;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;color:var(--pc-muted);font-size:13px;line-height:1.8}.pc-notice{margin-top:16px;color:#7d8590;font-size:12px;line-height:1.7}
.pc-detail-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.pc-detail-title label{display:flex;align-items:center;gap:6px;color:var(--pc-muted);font-size:11px;white-space:nowrap}.pc-detail-title select{height:30px;border:1px solid var(--pc-border);border-radius:5px;background:var(--pc-panel);color:var(--pc-text);padding:0 7px;font:inherit;font-size:11px}.pc-run-meta{margin:0 0 10px;color:var(--pc-muted);font-size:11px}
.pc-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(1,4,12,.72);backdrop-filter:blur(3px)}.pc-modal[data-open="true"]{display:flex}.pc-modal-card{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;border:1px solid #334155;border-radius:10px;background:#111827;box-shadow:0 24px 70px rgba(0,0,0,.5)}.pc-modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--pc-border)}.pc-modal-head h3{margin:0;color:var(--pc-text);font-size:17px}.pc-modal-head p{margin:5px 0 0;color:var(--pc-muted);font-size:12px}.pc-modal-close{border:0;background:transparent;color:var(--pc-muted);font-size:22px;cursor:pointer}.pc-modal-close:disabled{cursor:not-allowed;opacity:.4}.pc-download-form{padding:18px 20px}.pc-form-field{display:block;margin-bottom:15px}.pc-form-field>span{display:block;margin-bottom:7px;color:#c9d1d9;font-size:12px}.pc-form-field select,.pc-form-field textarea,.pc-form-field input{width:100%;box-sizing:border-box;border:1px solid #334155;border-radius:6px;background:#0d1117;color:var(--pc-text);font:inherit;font-size:13px;outline:none}.pc-form-field select,.pc-form-field input{height:38px;padding:0 10px}.pc-form-field textarea{min-height:90px;padding:10px;resize:vertical;line-height:1.6}.pc-form-field select:focus,.pc-form-field textarea:focus,.pc-form-field input:focus{border-color:#18a6b8;box-shadow:0 0 0 2px rgba(24,166,184,.14)}.pc-date-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pc-form-hint{margin:-8px 0 15px;color:var(--pc-muted);font-size:11px;line-height:1.5}.pc-download-status{display:none;min-height:84px;max-height:190px;overflow:auto;margin:0 0 15px;padding:10px;border:1px solid var(--pc-border);border-radius:6px;background:#080c12;color:#9da7b3;font:12px/1.6 Consolas,monospace;white-space:pre-wrap}.pc-download-status.active{display:block}.pc-modal-actions{display:flex;justify-content:flex-end;gap:10px}.pc-modal-actions button{height:36px;border-radius:6px;padding:0 15px;font:inherit;cursor:pointer}.pc-cancel{border:1px solid #3b4553;background:transparent;color:#c9d1d9}.pc-submit{border:1px solid #18a6b8;background:#148596;color:#fff}.pc-submit:disabled,.pc-cancel:disabled{cursor:not-allowed;opacity:.55}
@media(max-width:900px){.pc-layout{grid-template-columns:1fr}.pc-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.pc-header{align-items:start;flex-direction:column}.pc-actions{width:100%}.pc-table-wrap{overflow:auto}.pc-table{min-width:720px}}@media(max-width:560px){.pc-date-fields{grid-template-columns:1fr}.pc-actions button{flex:1}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-container"><div class="nav-brand"><span class="brand-icon"><i class="ti ti-chart-candle"></i></span><h1>DiAi-自交易系统</h1></div><ul class="nav-menu"><li><a href="index.html" class="nav-link">行情展示</a></li><li><a href="portfolio.html" class="nav-link">持仓分析</a></li><li><a href="choose_stock.html" class="nav-link">标的管理</a></li><li><a href="run_agent.html" class="nav-link">运行智能体</a></li><li><a href="prompt.html" class="nav-link">提示词管理</a></li><li><a href="market-display.html" class="nav-link">A股大盘</a></li><li><a href="predict-competition.html" class="nav-link active">预测竞赛</a></li></ul></div></nav>
<main class="container">
<header class="pc-header"><div><h2>预测竞赛 · 排行榜</h2><p id="pcMeta">加载预测和验证结果中</p></div><div class="pc-actions"><button class="pc-download" type="button" onclick="openQuickDownload()"><i class="ti ti-download"></i> 快速下载数据</button><button class="pc-refresh" type="button" onclick="loadCompetition()"><i class="ti ti-refresh"></i> 刷新结果</button></div></header>
<section class="pc-summary"><div class="pc-stat"><label>参赛智能体</label><strong id="pcAgents">--</strong></div><div class="pc-stat"><label>测试批次</label><strong id="pcRuns">--</strong></div><div class="pc-stat"><label>已验证预测</label><strong id="pcVerified">--</strong></div><div class="pc-stat"><label>最新预测日</label><strong id="pcDate">--</strong></div></section>
<section class="pc-layout"><main class="pc-detail" id="pcDetail"><div class="pc-empty">点击右侧排行榜中的智能体查看预测详情</div></main><aside class="pc-table-wrap" id="pcLeaderboard"><div class="pc-empty">正在加载排行榜...</div></aside></section>
<p class="pc-notice">排行榜只统计已存在实际交易数据的预测；目标日尚未到达的项目会标记为“待验证”。点击智能体后可查看每个指数的预测、实际结果、正确性和分析依据。</p>
</main>
<div class="pc-modal" id="pcDownloadModal" role="dialog" aria-modal="true" aria-labelledby="pcDownloadTitle" data-open="false">
  <div class="pc-modal-card">
    <div class="pc-modal-head"><div><h3 id="pcDownloadTitle">快速下载股票数据</h3><p>下载完成后自动生成完整目录、聚合数据和技术因子</p></div><button class="pc-modal-close" id="pcDownloadClose" type="button" aria-label="关闭" onclick="closeQuickDownload()">&times;</button></div>
    <form class="pc-download-form" id="pcDownloadForm" onsubmit="submitQuickDownload(event)">
      <label class="pc-form-field"><span>数据类型</span><select id="pcDownloadAsset" onchange="updateDownloadHint()"><option value="astock-index">A股指数（Tushare）</option><option value="astock">A股股票（Tushare）</option><option value="etf">场内 ETF（Tushare）</option><option value="us-stock">美股（yfinance）</option></select></label>
      <label class="pc-form-field"><span>标的代码</span><textarea id="pcDownloadSymbols" required placeholder="例如：000688.SH, 932000.CSI"></textarea></label>
      <p class="pc-form-hint" id="pcDownloadHint">支持 9 个内置 A 股指数代码，多个代码可用逗号、空格或换行分隔。</p>
      <div class="pc-date-fields"><label class="pc-form-field"><span>开始日期</span><input id="pcDownloadStart" type="date" required></label><label class="pc-form-field"><span>结束日期</span><input id="pcDownloadEnd" type="date" required></label></div>
      <pre class="pc-download-status" id="pcDownloadStatus" aria-live="polite"></pre>
      <div class="pc-modal-actions"><button class="pc-cancel" id="pcDownloadCancel" type="button" onclick="closeQuickDownload()">取消</button><button class="pc-submit" id="pcDownloadSubmit" type="submit"><i class="ti ti-download"></i> 下载</button></div>
    </form>
  </div>
</div>
<script src="assets/js/predict-competition.js?v=20260918"></script>
</body>
</html>
